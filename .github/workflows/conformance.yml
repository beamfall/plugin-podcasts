# Podcasts plugin conformance gate.
# Runs sdktest golden vectors against the SDK contract on every push and tagged
# release. The SDK resolves from the tagged go.mod requirement.
name: conformance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'plugin-sdk ref to test against'
        required: false
        type: string

jobs:
  fast-conformance:
    name: fast conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-podcasts
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-podcasts/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-podcasts
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: gofmt
        working-directory: beamfall-plugin-podcasts
        run: gofmt -l . | tee /dev/stderr | (! grep -q .)
      - name: vet
        working-directory: beamfall-plugin-podcasts
        run: go vet ./...
      - name: gate contracts
        working-directory: beamfall-plugin-podcasts
        run: script/gate.sh contracts
      - name: govulncheck
        working-directory: beamfall-plugin-podcasts
        run: go -C tools tool govulncheck -C .. ./...
      - name: tests and per-package coverage
        working-directory: beamfall-plugin-podcasts
        run: python3 .github/workflows/coverage_gate.py
      # v8.0.0
      - name: golangci-lint
        uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128
        with:
          version: v2.12.2
          working-directory: beamfall-plugin-podcasts

  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-podcasts
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-podcasts/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-podcasts
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: race
        working-directory: beamfall-plugin-podcasts
        run: script/gate.sh race

  # Preserve the established required-check name while making the parallel
  # race job mechanically blocking for every event.
  conformance:
    name: conformance
    needs: [fast-conformance, race]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require fast and race jobs
        env:
          FAST_RESULT: ${{ needs.fast-conformance.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$RACE_RESULT" = success

  fuzz:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout plugin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: beamfall-plugin-podcasts
      - name: Checkout SDK override
        if: ${{ inputs.sdk_ref != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: beamfall/plugin-sdk
          ref: ${{ inputs.sdk_ref }}
          path: beamfall-plugin-sdk
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: beamfall-plugin-podcasts/go.mod
      - name: Use SDK override
        if: ${{ inputs.sdk_ref != '' }}
        working-directory: beamfall-plugin-podcasts
        run: go mod edit -replace github.com/beamfall/plugin-sdk=../beamfall-plugin-sdk
      - name: bounded OPML fuzz
        working-directory: beamfall-plugin-podcasts
        env:
          FUZZ_TIME: 30s
        run: script/gate.sh fuzz
